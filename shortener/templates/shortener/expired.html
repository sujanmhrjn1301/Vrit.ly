{% extends "shortener/base.html" %}

{% block title %}URL Expired - URL Shortener{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card text-center">
            <div class="card-body py-5">
                <i class="fas fa-clock fa-5x text-warning mb-3"></i>
                <h2 class="card-title">URL Expired</h2>
                <p class="card-text text-muted">
                    This shortened URL has expired and is no longer available.
                </p>
                <a href="{% url 'landing' %}" class="btn btn-primary mt-3">
                    <i class="fas fa-home"></i> Go Home
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
